<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>我是一个html</h1>
    <h2>有语义的标签</h2>
    加粗：<strong>我是一个加粗的文字</strong>
    斜体：<em>我是一个斜体的文字</em>
    下划线：<ins>我是一个下划线的文字</ins>
    删除线：<del>我是一个删除线的文字</del>

    <h2>无语义的标签 </h2>
    加粗：<b>我是一个加粗的文字</b>
    斜体：<i>我是一个斜体的文字</i>
    下划线：<u>我是一个下划线的文字</u>
    删除线：<s>我是一个删除线的文字</s>
    <h1>块级元素</h1>
    <!--img      图片标签      -->
    <img src="./images/1.jpg" alt="我是一个图片" width="300px" height="300px" title="我是一个图片">
    <h2>视频标签</h2>
    <!--video      视频标签      -->
    <video src="https://www.w3schools.com/html/mov_bbb.mp4" controls width="300px" height="300px" title="我是一个视频"
        autoplay></video>
    <video autoplay muted controls>
        <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
        您的浏览器不支持 video 标签。
    </video>
    <!--href  -->
</body>

</html>
