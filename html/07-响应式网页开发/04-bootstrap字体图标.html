<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bootstrap字体图标</title>
    <link rel="stylesheet" href="./bootstrap/bootstrap.min.css">
    <!-- 引入bs 字体图标库 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <script src="./bootstrap/bootstrap.min.js"></script>
    <style>
        .icon {
            font-size: 30px;
        }

        .btn-success {
            width: 100px;
        }
    </style>

</head>

<body>
    <i class="bi bi-wifi icon"></i>
    <i class="bi bi-watch icon"></i>
    <i class="bi bi-alarm"></i>
    <i class="bi bi-alarm" style="font-size: 2rem; color: cornflowerblue;"></i>

    <svg class="bi" width="32" height="32" fill="currentColor">
        <use xlink:href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/bootstrap-icons.svg#heart-fill" />
    </svg>
    <svg class="bi" width="32" height="32" fill="currentColor">
        <use xlink:href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/bootstrap-icons.svg#toggles" />
    </svg>
    <svg class="bi" width="32" height="32" fill="currentColor">
        <use xlink:href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/bootstrap-icons.svg#shop" />
    </svg>
    <!-- 按钮图标 -->
    <button type="button" class="btn btn-success">Success</button>


</body>

</html>
