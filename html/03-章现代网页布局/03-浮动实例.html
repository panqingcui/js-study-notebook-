<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main-box {
            width: 500px;
            margin: 0 auto;
        }

        .son1 {
            float: left;
            width: 150px;
            height: 50px;
            background-color: pink;
        }

        .son2 {
            float: left;
            width: 150px;
            height: 50px;
            background-color: aquamarine;
        }

        .footer {
            width: 100%;
            height: 50px;
            background-color: #f093fb;
        }

        /* 第一种清除浮动，防止子元素影响父元素布局，导致父元素高度塌陷 */
        .clear {
            clear: both;
        }

        /* 第二种清除浮动，防止子元素影响父元素布局，导致父元素高度塌陷 */
        .clearfix::after {
            content: "";
            display: block;
            clear: both;
        }

        /* 第三种清除浮动，overflow: hidden; */
    </style>
</head>

<body>
    <div class="main-box clearfix">
        <div class="son1"></div>
        <div class="son2"></div>

    </div>
    <div class="footer"></div>
</body>

</html>
