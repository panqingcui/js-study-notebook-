<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>弹性布局</title>
    <link rel="stylesheet" href="./iconfont/iconfont.css">
    <!-- 引性布局 -->
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        ul,
        ol {
            list-style: none;
        }

        /* 弹性布局 */
        .main-box {
            display: flex;
            /* 弹性布局的主轴对齐方式 space-between 间距相等 */
            /* justify-content: space-between; */
            /* space-around 间距相等，每个元素间距相等 */
            justify-content: space-around;
            /* space-evenly 间距相等，每个元素间距相等，包括元素之间的间距 */
            justify-content: space-evenly;
            /*交叉轴 center 居中对齐 */
            align-items: center;
        }

        .son1 {
            width: 100px;
            height: 200px;
            background: #667eea;
        }

        .son2 {
            width: 100px;
            height: 200px;
            background: #f093fb;
        }

        .son3 {
            width: 100px;
            height: 200px;
            background: #f5576c;
        }

        /* 三连线 */
        .sanlian {
            display: flex;
            justify-content: flex-start;
            align-items: center;
        }

        .iconfont {
            font-size: 30px;
        }

        .sanlian li {
            width: 60px;
            height: 80px;
            /* border: 1px solid red; */
        }

        /* 多行弹性布局，wrap */
        .sanlian li a {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
        }

        /* gap 间距 */
        .box {
            gap: 10px;
        }

        /* 多行弹性布局，wrap */
        .box {
            display: flex;
            /* 强制换行 */
            flex-wrap: wrap;
            /* 主轴 等分 居中对齐 */
            justify-content: space-between;
            /* 交叉轴 center 居中对齐 */
            align-content: center;
            width: 830px;
        }


        /* flex 每个元素等分，20% 宽度，实现换行 */
        .item {
            /* flex: 0 0 20%; */
            width: 200px;
            height: 300px;
            background-color: pink;
            border-radius: 10px;
            margin-bottom: 10px;

        }

        /* flex 每个元素等分，20% 宽度，实现换行 */
        .boxflex {
            display: flex;
            /* 间距 gap 比margin 更好用 */
            gap: 10px;
            /* justify-content: space-between; */
            width: 80%;
            border: 1px solid blue;
            margin: 0 auto;

        }

        /* flex 每个元素等分 伸缩比例 */
        .itemflex {
            /* flex要写到 小盒子身上  优先级比 width 和 height高 */
            /* flex 1 表示占1份 */
            flex: 1;
            width: 80px;
            height: 100px;
            background-color: pink;
            text-align: center;
            font-size: 30px;
            /* 行高 实现内容的垂直居中对齐 */
            line-height: 100px;
        }

        /* 多行伸缩 */
        .boxmult {
            display: flex;
            /* 强制换行 */
            flex-wrap: wrap;
            gap: 10px;
            justify-content: space-between;
            width: 80%;
            border: 1px solid blue;
            margin: 0 auto;
        }

        .itemmult {
            /* flex 1 表示占1份 */
            flex: 0 0 20%;
            width: 80px;
            height: 100px;
            background-color: pink;
            text-align: center;
            font-size: 30px;
            /* 行高 实现内容的垂直居中对齐 */
            line-height: 100px;
        }
    </style>
</head>

<body>
    <div class="main-box">
        <div class="son1"></div>
        <div class="son2"></div>
        <div class="son3"></div>
    </div>
    <ul class="sanlian">
        <li>
            <a href="#">
                <i class="iconfont icon-dianzan"></i>
                <p>点赞</p>
            </a>
        </li>
        <li>
            <a href="#">
                <i class="iconfont icon-yingbi"></i>
                <p>硬币</p>
            </a>
        </li>
        <li>
            <a href="#">
                <i class="iconfont icon-shoucang"></i>
                <p>收藏</p>
            </a>
        </li>
    </ul>
    <h3>多行弹性布局，强制换行wrap</h3>
    <div class="box">
    </div>
    <h3>伸缩，flex:1(单行伸缩)</h3>
    <div class="boxflex">
    </div>
    <h3>多行伸缩</h3>
    <div class="boxmult">
    </div>
    <script>
        const box = document.querySelector('.box');
        const boxflex = document.querySelector('.boxflex');
        const boxmult = document.querySelector('.boxmult');
        for (let i = 1; i <= 10; i++) {
            const item = box.appendChild(document.createElement('div'));
            item.classList.add('item');
            item.textContent = i;
        }
        for (let i = 1; i <= 10; i++) {
            const item = boxflex.appendChild(document.createElement('div'));
            item.classList.add('itemflex');
            item.textContent = i;
        }
        for (let i = 1; i <= 10; i++) {
            const item = boxmult.appendChild(document.createElement('div'));
            item.classList.add('itemmult');
            item.textContent = i;
        }
    </script>
</body>

</html>
