<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>360极速浏览器效果</title>
    <style>
        /* 全局样式 */
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            overflow: hidden;
            /* background-color: #000; */
            /* 背景图片 不重复 */
            /* 背景图片 居中 */
            /* 背景图片 覆盖 */
            /* 背景颜色 */
            background: url(./img/bg.jpg) no-repeat center/cover #000;
        }

        .ball1 {
            position: absolute;
            left: 20%;
            top: 22%;
            width: 13%;
        }

        .ball2 {
            position: absolute;
            left: 65%;
            top: 50%;
            width: 22%;
        }

        .wx {
            position: absolute;
            width: 8%;
            left: 64%;
            top: 40%;
        }

        /* 定义球体的运动动画 */
        @keyframes ballanimation {
            0% {
                transform: translateY(0);
            }

            100% {
                transform: translateY(-25px);
            }
        }

        /* 球体调用动画 */
        .ball1 {
            /* 球体1的运动动画 */
            /* 球体1的运动动画时间 */
            /* 球体1的运动动画循环 */
            /* 球体1的运动动画方向 */
            animation: ballanimation 5s linear infinite alternate;
        }

        .ball2 {
            animation: ballanimation 6s linear infinite alternate;
        }


        @keyframes rotate {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(-45deg);
            }
        }

        .wx {
            animation: rotate 30s linear infinite alternate;
        }
    </style>
</head>

<body>

    <body>
        <img src="./img/ball1.png" alt="" class="ball1">
        <img src="./img/ball2.png" alt="" class="ball2">
        <img src="./img/wx.png" alt="" class="wx">
    </body>
</body>

</html>
