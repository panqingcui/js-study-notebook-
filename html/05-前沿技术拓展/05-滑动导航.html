<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>滑动导航 (JS + transform)</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #2c3e50;
        }

        nav {
            margin: 100px auto;
            position: relative;
            width: 750px;
            height: 50px;
            background-color: #34495e;
            border-radius: 8px;
            font-size: 0;
            box-shadow: 2px 2px 2px #000;
        }

        nav a {
            width: 150px;
            height: 100%;
            line-height: 50px;
            font-size: 15px;
            display: inline-block;
            position: relative;
            z-index: 1;
            text-decoration: none;
            text-transform: uppercase;
            text-align: center;
            color: white;
            cursor: pointer;
        }

        nav .animation {
            position: absolute;
            height: 100%;
            top: 0;
            left: 0;
            z-index: 0;
            width: 150px;
            border-radius: 8px;
            background-color: #1abc9c;
            transform: translateX(0);
            transition:
                transform 0.5s cubic-bezier(0.4, 0, 0.2, 1),
                background-color 0.5s ease;
        }
    </style>
</head>

<body>
    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Blog</a>
        <a href="#">News</a>
        <a href="#">Contact</a>
        <div class="animation"></div>
    </nav>

    <script>
        const nav = document.querySelector('nav');
        const links = nav.querySelectorAll('a');
        const indicator = nav.querySelector('.animation');

        const colors = ['#1abc9c', '#e74c3c', '#3498db', '#9b59b6', '#e67e22'];
        const tabWidth = 150;

        links.forEach((link, index) => {
            link.addEventListener('mouseenter', () => {
                indicator.style.transform = `translateX(${index * tabWidth}px)`;
                indicator.style.backgroundColor = colors[index];
            });
        });
    </script>
</body>

</html>
