<body>
    <h2>性能调优</h1>

            <li>防抖</li>

        </ul>
        <div id="container"></div>
        <script src="./js/lodash.min.js"></script>
        <script>
            // 防抖 函数 单位时间内频繁触发事件 只执最后一次
            function debounce(fn, delay) {
                let timer = null;
                return function (...args) {
                    if (timer) {
                        clearTimeout(timer);
                    }
                    timer = setTimeout(() => {
                        fn.apply(this, args);
                    }, delay);
                }
            }
            const container = document.getElementById('container');
            let content = 1;
            // container.addEventListener('mousemove', debounce(() => {
            //     container.innerHTML = content++;;
            // }, 100));
            // ✅ 匿名函数完全可以传递
            container.addEventListener('mousemove', _.throttle(() => {
                container.innerHTML = content++;
            }, 100));

            // // ✅ 命名函数也可以
            function handleClick() {
                container.innerHTML = content++;
            }
            // container.addEventListener('mousemove', _.throttle(handleClick, 100));
        </script>
