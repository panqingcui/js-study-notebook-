<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./css/index.css">
</head>


<body>
    <h1>新增学员</h1>
    <form class="info" autocomplete="off">
        姓名：<input type="text" class="uname" name="uname" />
        年龄：<input type="text" class="age" name="age" />
        性别:
        <select name="gender" class="gender">
            <option value="男">男</option>
            <option value="女">女</option>
        </select>
        薪资：<input type="text" class="salary" name="salary" />
        就业城市：<select name="city" class="city">
            <option value="北京">北京</option>
            <option value="上海">上海</option>
            <option value="广州">广州</option>
            <option value="深圳">深圳</option>
            <option value="曹县">曹县</option>
        </select>
        <button class="add">录入</button>
    </form>
    <h1>就业榜</h1>
    <table>
        <thead>
            <tr>
                <th>学号</th>
                <th>姓名</th>
                <th>年龄</th>
                <th>性别</th>
                <th>薪资</th>
                <th>就业城市</th>
                <th>操作</th>
            </tr>
        </thead>
        <tbody>
            <!-- 
        <tr>
          <td>1001</td>
          <td>欧阳霸天</td>
          <td>19</td>
          <td>男</td>
          <td>15000</td>
          <td>上海</td>
          <td>
            <a href="javascript:">删除</a>
          </td>
        </tr> 
        -->
        </tbody>
    </table>

    <script>
        // 1. 获取元素
        const form = document.querySelector('.info')
        const tbody = document.querySelector('tbody')
        const addBtn = document.querySelector('.add')
        const uname = document.querySelector('.uname')
        const age = document.querySelector('.age')
        const gender = document.querySelector('.gender')
        const salary = document.querySelector('.salary')
        const city = document.querySelector('.city')
        //存储学员信息
        const arr = localStorage.getItem('studentInfo') ? JSON.parse(localStorage.getItem('studentInfo')) : []
        // 渲染数据
        renderData(arr)

        form.addEventListener('submit', function (event) {
            // 阻止默认行为（防止页面刷新）
            event.preventDefault()

            // 非空校验
            if (!uname.value.trim()) {
                alert('姓名不能为空！')
                uname.focus()
                return
            }
            if (!age.value.trim()) {
                alert('年龄不能为空！')
                age.focus()
                return
            }
            if (!salary.value.trim()) {
                alert('薪资不能为空！')
                salary.focus()
                return
            }

            // 合法性校验
            // 年龄必须是 18~60 之间的整数
            if (!/^\d+$/.test(age.value) || age.value < 18 || age.value > 60) {
                alert('年龄必须是 18~60 之间的整数！')
                age.focus()
                return
            }
            // 薪资必须是正数
            if (isNaN(salary.value) || Number(salary.value) <= 0) {
                alert('薪资必须是大于0的数字！')
                salary.focus()
                return
            }

            const obj = {
                id: arr.length > 0 ? Math.max(...arr.map(item => item.id)) + 1 : 1001,
                uname: uname.value.trim(),
                age: age.value,
                gender: gender.value,
                salary: salary.value,
                city: city.value
            }
            arr.push(obj)
            // 清空表单
            this.reset()
            // 渲染数据
            renderData(arr)
        })
        // 渲染数据
        function renderData(arr) {
            tbody.innerHTML = ''
            // arr.forEach(item => {
            //     tbody.innerHTML += `
            //     <tr>
            //         <td>${item.id}</td>
            //         <td>${item.uname}</td>
            //         <td>${item.age}</td>
            //         <td>${item.gender}</td>
            //         <td>${item.salary}</td>
            //         <td>${item.city}</td>
            //         <td>
            //             <a href="javascript:;" data-id="${item.id}" class="del">删除</a>
            //         </td>
            //     </tr>
            //     `
            // })
            // 用map join 替代上面的实现
            tbody.innerHTML = arr.map(item => `
                <tr>
                    <td>${item.id}</td>
                    <td>${item.uname}</td>
                    <td>${item.age}</td>
                    <td>${item.gender}</td>
                    <td>${item.salary}</td>
                    <td>${item.city}</td>
                    <td>
                        <a href="javascript:;" data-id="${item.id}" class="del">删除</a>
                    </td>
                </tr>
                `).join('')

            // 存储到本地存储
            localStorage.setItem('studentInfo', JSON.stringify(arr))
        }

        // 删除数据：使用事件委托，监听 tbody 的 click 事件
        tbody.addEventListener('click', function (e) {
            // 判断点击的是否是删除按钮
            if (e.target.classList.contains('del')) {
                // 通过 data-id 自定义属性获取对应 id
                const id = +e.target.dataset.id
                // 根据id找到对应项的索引，从数组中删除
                const index = arr.findIndex(item => item.id === id)
                if (index !== -1) {
                    arr.splice(index, 1)
                }
                // 存储到本地存储
                localStorage.setItem('studentInfo', JSON.stringify(arr))
                // 重新渲染表格
                renderData(arr)

            }
        })

    </script>
</body>

</html>
