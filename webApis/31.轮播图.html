<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>轮播图</title>
    <style>
        /* 重置默认样式 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* 页面布局：居中显示 */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
        }

        /* 轮播图容器 */
        .carousel {
            position: relative;
            /* 相对定位，作为子元素绝对定位的参考 */
            width: 800px;
            height: 400px;
            overflow: hidden;
            /* 隐藏超出容器的内容 */
            border-radius: 10px;
            /* 圆角 */
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            /* 阴影效果 */
        }

        /* 轮播图列表容器 */
        .carousel-list {
            position: relative;
            width: 100%;
            height: 100%;
        }

        /* 单个轮播项：使用绝对定位叠加在一起 */
        .carousel-item {
            position: absolute;
            /* 绝对定位，所有图片叠加在同一位置 */
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            /* 默认隐藏 */
            transition: opacity 0.5s ease-in-out;
            /* 透明度变化动画 */
        }

        /* 当前激活的轮播项：显示 */
        .carousel-item.active {
            opacity: 1;
            /* 显示当前图片 */
        }

        /* 图片样式：填满容器 */
        .carousel-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            /* 保持比例裁剪填充 */
        }

        /* 左右箭头按钮 */
        .arrow {
            position: absolute;
            /* 绝对定位在轮播图上方 */
            top: 50%;
            /* 垂直居中 */
            transform: translateY(-50%);
            /* 修正垂直居中偏移 */
            width: 50px;
            height: 50px;
            background-color: rgba(0, 0, 0, 0.5);
            /* 半透明黑色背景 */
            color: white;
            font-size: 24px;
            border: none;
            border-radius: 50%;
            /* 圆形按钮 */
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: background-color 0.3s;
            /* 背景色变化动画 */
            z-index: 10;
            /* 确保按钮在图片上方 */
        }

        /* 箭头悬停效果 */
        .arrow:hover {
            background-color: rgba(0, 0, 0, 0.8);
            /* 悬停时背景变深 */
        }

        /* 左箭头位置 */
        .arrow-left {
            left: 20px;
        }

        /* 右箭头位置 */
        .arrow-right {
            right: 20px;
        }

        /* 底部指示器容器 */
        .indicators {
            position: absolute;
            bottom: 20px;
            /* 距离底部20px */
            left: 50%;
            /* 水平居中 */
            transform: translateX(-50%);
            /* 修正水平居中偏移 */
            display: flex;
            gap: 10px;
            /* 指示器之间的间距 */
            z-index: 10;
            /* 确保指示器在图片上方 */
        }

        /* 单个指示器（小圆点） */
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            /* 圆形 */
            background-color: rgba(255, 255, 255, 0.5);
            /* 半透明白色 */
            cursor: pointer;
            transition: all 0.3s;
            /* 所有属性变化动画 */
        }

        /* 激活状态的指示器 */
        .indicator.active {
            background-color: white;
            /* 纯白色 */
            transform: scale(1.2);
            /* 放大效果 */
        }

        /* 指示器悬停效果 */
        .indicator:hover {
            background-color: rgba(255, 255, 255, 0.8);
            /* 悬停时变亮 */
        }
    </style>
</head>

<body>
    <!-- 轮播图整体容器 -->
    <div class="carousel" id="carousel">
        <!-- 轮播图列表 -->
        <div class="carousel-list" id="carouselList">
            <div class="carousel-item active">
                <img src="images/slider01.jpg" alt="轮播图1">
            </div>
            <div class="carousel-item">
                <img src="images/slider02.jpg" alt="轮播图2">
            </div>
            <div class="carousel-item">
                <img src="images/slider03.jpg" alt="轮播图3">
            </div>
            <div class="carousel-item">
                <img src="images/slider04.jpg" alt="轮播图4">
            </div>
            <div class="carousel-item">
                <img src="images/slider05.jpg" alt="轮播图5">
            </div>
        </div>

        <!-- 左右切换箭头按钮 -->
        <button class="arrow arrow-left" id="prevBtn">&#10094;</button>
        <button class="arrow arrow-right" id="nextBtn">&#10095;</button>

        <!-- 底部指示器容器（由JS动态生成） -->
        <div class="indicators" id="indicators"></div>
    </div>

    <script>
        // 获取DOM元素
        const carousel = document.getElementById('carousel');
        const carouselList = document.getElementById('carouselList');
        const items = carouselList.querySelectorAll('.carousel-item'); // 所有轮播项
        const prevBtn = document.getElementById('prevBtn'); // 左箭头按钮
        const nextBtn = document.getElementById('nextBtn'); // 右箭头按钮
        const indicatorsContainer = document.getElementById('indicators'); // 指示器容器

        // 状态变量
        let currentIndex = 0; // 当前显示的图片索引
        let autoPlayTimer = null; // 自动播放定时器
        const autoPlayInterval = 3000; // 自动播放间隔（3秒）

        /**
         * 创建底部指示器（小圆点）
         * 根据轮播图数量动态生成对应数量的指示器
         */
        function createIndicators() {
            items.forEach((_, index) => {
                const indicator = document.createElement('div');
                // 第一个指示器默认激活
                indicator.className = 'indicator' + (index === 0 ? ' active' : '');
                // 点击指示器跳转到对应图片
                indicator.addEventListener('click', () => goToSlide(index));
                indicatorsContainer.appendChild(indicator);
            });
        }

        /**
         * 跳转到指定索引的轮播图
         * @param {number} index - 目标图片的索引
         */
        function goToSlide(index) {
            // 移除当前图片和指示器的激活状态
            items[currentIndex].classList.remove('active');
            document.querySelectorAll('.indicator')[currentIndex].classList.remove('active');

            // 更新当前索引
            currentIndex = index;

            // 添加新的激活状态
            items[currentIndex].classList.add('active');
            document.querySelectorAll('.indicator')[currentIndex].classList.add('active');
        }

        /**
         * 切换到下一张图片
         * 使用取模运算实现循环：到最后一张后回到第一张
         */
        function nextSlide() {
            const nextIndex = (currentIndex + 1) % items.length;
            goToSlide(nextIndex);
        }

        /**
         * 切换到上一张图片
         * 使用 (currentIndex - 1 + items.length) 防止负数索引
         */
        function prevSlide() {
            const prevIndex = (currentIndex - 1 + items.length) % items.length;
            goToSlide(prevIndex);
        }

        /**
         * 开始自动播放
         * 先停止已有的定时器，再创建新的定时器
         */
        function startAutoPlay() {
            stopAutoPlay(); // 防止重复创建定时器
            autoPlayTimer = setInterval(nextSlide, autoPlayInterval);
        }

        /**
         * 停止自动播放
         * 清除定时器并重置为null
         */
        function stopAutoPlay() {
            if (autoPlayTimer) {
                clearInterval(autoPlayTimer);
                autoPlayTimer = null;
            }
        }

        // 左箭头点击事件：切换到上一张，并重新开始自动播放
        prevBtn.addEventListener('click', () => {
            prevSlide();
            startAutoPlay();
        });

        // 右箭头点击事件：切换到下一张，并重新开始自动播放
        nextBtn.addEventListener('click', () => {
            nextSlide();
            startAutoPlay();
        });

        // 鼠标移入轮播图区域：暂停自动播放
        carousel.addEventListener('mouseenter', stopAutoPlay);

        // 鼠标离开轮播图区域：恢复自动播放
        carousel.addEventListener('mouseleave', startAutoPlay);

        // 初始化：创建指示器并启动自动播放
        createIndicators();
        startAutoPlay();
    </script>
</body>

</html>
