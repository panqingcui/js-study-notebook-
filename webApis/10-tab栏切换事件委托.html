<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    * {
        margin: 0;
        padding: 0;
    }

    .tab {
        width: 590px;
        height: 340px;
        margin: 20px;
        border: 1px solid #e4e4e4;
    }

    .tab-nav {
        width: 100%;
        height: 60px;
        line-height: 60px;
        display: flex;
        justify-content: space-between;
    }

    .tab-nav h3 {
        font-size: 24px;
        font-weight: normal;
        margin-left: 20px;
    }

    .tab-nav ul {
        list-style: none;
        display: flex;
        justify-content: flex-end;
    }

    .tab-nav ul li {
        margin: 0 20px;
        font-size: 14px;
    }

    .tab-nav ul li a {
        text-decoration: none;
        border-bottom: 2px solid transparent;
        color: #333;
    }

    .tab-nav ul li a.active {
        border-color: #e1251b;
        color: #e1251b;
    }

    .tab-content {
        padding: 0 16px;
    }

    .tab-content .item {
        display: none;
    }

    .tab-content .item.active {
        display: block;
    }
</style>

<body>
    <div id="tab">
        <div class="tab-nav">
            <h3>每日特价</h3>
            <ul>
                <li><a class="active" href="javascript:;">精选</a></li>
                <li><a href="javascript:;">美食</a></li>
                <li><a href="javascript:;">百货</a></li>
                <li><a href="javascript:;">个护</a></li>
                <li><a href="javascript:;">预告</a></li>
            </ul>
        </div>
        <div class="tab-content">
            <div class="item active"><img src="./images/tab00.png" alt="" /></div>
            <div class="item"><img src="./images/tab01.png" alt="" /></div>
            <div class="item"><img src="./images/tab02.png" alt="" /></div>
            <div class="item"><img src="./images/tab03.png" alt="" /></div>
            <div class="item"><img src="./images/tab04.png" alt="" /></div>
        </div>
    </div>
    <script>
        // 1. 获取元素
        const tabNav = document.querySelector('.tab-nav')
        const tabContent = document.querySelector('.tab-content')
        const tabNavItems = tabNav.querySelectorAll('li')
        const tabContentItems = tabContent.querySelectorAll('.item')
        // 2. 绑定事件

        //借助事件委托实现tab栏切换 ,不能使用mouseenter事件,因为mouseenter事件没有冒泡行为
        tabNav.addEventListener('click', function (e) {
            console.log(e)
            // 2.1 检查点击的元素是否是a
            if (e.target.tagName === 'A') {
                // 2.2 获取当前点击的a的父元素li在所有li中的索引
                const index = Array.from(tabNavItems).indexOf(e.target.parentNode)
                console.log(index)
                // 2.3 切换导航栏样式
                tabNav.querySelector('.active').classList.remove('active')
                e.target.classList.add('active')
                // 2.4 切换内容区域
                tabContent.querySelector('.active').classList.remove('active')
                tabContentItems[index].classList.add('active')
            }
        })


    </script>
</body>

</html>
