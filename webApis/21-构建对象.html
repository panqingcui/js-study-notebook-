        console.log('--- Object-----');
        console.log('Object.keys 静态方法获取对象中所有属性（键）');
        for (let key of Object.keys(p1)) {
            console.log(key);
        }
        console.log('Object.values 静态方法获取对象中所有属性值');
        for (let value of Object.values(p1)) {
            console.log(value);
        }

        console.log('Object.entries 静态方法获取对象中所有属性（键值对）');
        for (let [key, value] of Object.entries(p1)) {
            console.log(key + ': ' + value);
        }
        console.log('Object.assign 静态方法常用于对象拷贝');
        let p2 = Object.assign({}, p1);
        console.log(p2);
        console.log(p2.name);
        console.log(p2.age);
        console.log('--- 数组-----');
        let arr = [4, 1, 2, 3];
        console.log('数组遍历');
        for (let item of arr) {
            console.log(item + ': ' + arr.indexOf(item));
        }
        console.log('数组排序');
        arr.sort((a, b) => a - b);
        console.log(arr);

        console.log('数组反转');
        arr.reverse();
        console.log(arr);
        console.log('forEach遍历数组')
        arr.forEach((item, index) => {
            console.log(item + ': ' + index);
        })
        console.log('filter过滤数组');
        let newArr = arr.filter((item) => item > 2);
        console.log(newArr);
        console.log('map映射数组');
        let newArr2 = arr.map((item) => item * 2);
        console.log(newArr2);
        console.log('reduce.reduce 方法用于对数组中的每个元素执行一个由您提供的的 reducer 函数(升序执行)，将其结果汇总为单个返回值。');
        let sum = arr.reduce((acc, cur) => acc + cur, 0);
        console.log(sum);

        const giftHtml = gift.split(',').map((item) =>
