<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>放大镜效果 v2</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            padding: 50px;
        }

        .preview {
            position: relative;
            width: 400px;
        }

        .middle {
            position: relative;
            width: 400px;
            height: 400px;
            border: 1px solid #ccc;
            overflow: hidden;
        }

        .middle img {
            width: 100%;
            height: 100%;
        }

        .layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 200px;
            height: 200px;
            background: rgba(0, 0, 0, 0.3);
            display: none;
            cursor: move;
        }

        .small {
            margin-top: 10px;
        }

        .small ul {
            list-style: none;
            display: flex;
            gap: 10px;
        }

        .small li {
            width: 60px;
            height: 60px;
            border: 2px solid transparent;
            cursor: pointer;
            overflow: hidden;
        }

        .small li.active {
            border-color: #e1251b;
        }

        .small img {
            width: 100%;
            height: 100%;
        }

        .large {
            position: absolute;
            top: 0;
            left: 410px;
            width: 400px;
            height: 400px;
            border: 1px solid #ccc;
            background-repeat: no-repeat;
            display: none;
        }
    </style>
</head>

<body>
    <div class="preview">
        <div class="middle">
            <img src="./images/b01.jpg" alt="">
            <div class="layer"></div>
        </div>
        <div class="large"></div>
        <div class="small">
            <ul>
                <li class="active"><img src="./images/b01.jpg" alt=""></li>
                <li><img src="./images/b02.jpg" alt=""></li>
                <li><img src="./images/b03.jpg" alt=""></li>
                <li><img src="./images/b04.jpg" alt=""></li>
                <li><img src="./images/b05.jpg" alt=""></li>
            </ul>
        </div>
    </div>

    <script>
        const middle = document.querySelector('.middle')
        const middleImg = middle.querySelector('img')
        const layer = document.querySelector('.layer')
        const large = document.querySelector('.large')
        const small = document.querySelector('.small')
        // 放大镜比例
        const scale = 2
        large.style.backgroundSize = middle.offsetWidth * scale + 'px ' + middle.offsetHeight * scale + 'px'

        small.addEventListener('mouseover', function (e) {
            if (e.target.tagName !== 'IMG') return
            const li = e.target.parentNode
            if (li.classList.contains('active')) return

            this.querySelector(' .active').classList.remove('active')

            // li.classList.add('active')
            // this.parentNode.classList.add('active')
            // 点击的图片添加active类名 上一级li
            e.target.parentNode.classList.add('active')
            //中等盒子图片切换
            middleImg.src = e.target.src
            // 大盒子图片切换
            large.style.backgroundImage = `url(${e.target.src})`
        })

        let timer = null
        function show() {
            clearTimeout(timer)
            layer.style.display = 'block'
            large.style.display = 'block'
        }
        function hide() {
            timer = setTimeout(() => {
                layer.style.display = 'none'
                large.style.display = 'none'
            }, 200)
        }
        middle.addEventListener('mouseenter', show)
        middle.addEventListener('mouseleave', hide)
        large.addEventListener('mouseenter', show)
        large.addEventListener('mouseleave', hide)
        // 鼠标移动事件 放大镜移动
        middle.addEventListener('mousemove', function (e) {
            //getBoundingClientRect() 获取元素的大小及其相对于视口的位置
            //pageX 鼠标距离文档左边界的距离
            //x,y 鼠标距离中等盒子的距离
            const x = e.pageX - middle.getBoundingClientRect().left
            //y 鼠标距离中等盒子的距离 - 滚动条距离
            // 因为滚动条距离是动态的，所以需要减去滚动条距离
            const y = e.pageY - middle.getBoundingClientRect().top - document.documentElement.scrollTop

            let lx = x - layer.offsetWidth / 2
            let ly = y - layer.offsetHeight / 2
            // 防止放大镜超出中等盒子的x,y 不超出范围
            lx = Math.max(0, Math.min(lx, middle.offsetWidth - layer.offsetWidth))
            ly = Math.max(0, Math.min(ly, middle.offsetHeight - layer.offsetHeight))
            layer.style.left = lx + 'px'
            layer.style.top = ly + 'px'

            large.style.backgroundPositionX = -lx * scale + 'px'
            large.style.backgroundPositionY = -ly * scale + 'px'
        })
    </script>
</body>

</html>
