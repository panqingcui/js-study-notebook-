    <script>
        // 函数的定义
        function sayHello() {
            console.log('hello world')
        }
        sayHello()

        //数组求和函数
        function sum(arr) {
            let total = 0
            for (let i = 0; i < arr.length; i++) {
                total += arr[i]
            }
            return total

        }
        console.log(sum([10, 20, 30, 40]))
        function max(arr) {
            let max = arr[0]
            for (let i = 0; i < arr.length; i++) {
                if (arr[i] > max) {
                    max = arr[i]
                }
            }
            return max
        }
        let numArr = [10, 20, 30, 40]
        console.log(numArr + '数组的最大值是:' + max(numArr))

        //匿名函数，立即执行函数
        (function () {

        })();

        function f3(a, b) {
            a = a || 0
            b = b || 0
            return a + b
        }
        console.log(f3(10, 20))
        console.log(f3(10))
