<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        // 循环语句for
        let row = +prompt('请输入行数：')
        document.write('<br>倒三角形星星<br>')
        for (let i = row; i >= 1; i--) {
            for (let j = 1; j <= i; j++) {
                document.write('*')
            }
            document.write('<br>')
        }
        document.write('<br>普通三角形星星<br>')
        for (let i = 0; i < row; i++) {
            for (let j = 0; j <= i; j++) {
                document.write('*')
            }
            document.write('<br>')
        }
    </script>
</body>

</html>
