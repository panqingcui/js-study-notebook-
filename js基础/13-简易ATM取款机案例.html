<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        /*
         需求：模拟ATM取款机，用户可以选择取钱、存钱、查看余额、退出
         ①：循环的时候，需要反复提示输入框，所以提示框写到循环里面
         ②：退出的条件是用户输入了 4，如果是4，则结束循环，不在弹窗
         ③：提前准备一个金额预先存储一个数额
         ④：取钱则是减法操作， 存钱则是加法操作，查看余额则是直接显示金额
         ⑤：输入不同的值，可以使用switch来执行不同的操作
        */
        /* 实现步骤   */
        let money = 1000
        let msg = ''
        let num = 0
        while (true) {
            msg = prompt(`
                    请您选择操作：
                    1.取钱
                    2.存钱
                    3.查看余额
                    4.退出
            `)
            if (msg == '4') {
                break
            }

            switch (msg) {
                case '1':
                    num = prompt('请输入金额：')
                    money -= num
                    document.write(`您取了${num}元，当前余额为${money}元`)
                    break
                case '2':
                    num = prompt('请输入金额：')
                    money += num
                    document.write(`您存了${num}元，当前余额为${money}元`)
                    break
                case '3':
                    document.write(`您的余额为${money}元`)
                    alert(`您的银行卡余额是${money}`)
                    break
                default:
                    document.write('输入错误')
                    break
            }
        }

    </script>
</body>

</html>
