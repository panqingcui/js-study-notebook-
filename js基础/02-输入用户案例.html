<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>用户用户案例</h1>
    <script>
        // 请输入你的姓名
        let name = prompt('请输入你的姓名')
        document.write('你好，' + name)
        // 请输入你的年龄
        let age = prompt('请输入你的年龄')
        document.write('<br>你的年龄是：' + age)
        // 请输入你的性别
        let sex = prompt('请输入你的性别')
        document.write('<br>你的性别是：' + sex)
    </script>
</body>

</html>
