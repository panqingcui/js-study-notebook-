<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>

    <script>
        //需求：用户输入2个数字，然后输入 + - * / 任何一个，可以计算结果
        // num1 = +prompt('请输入第一个数字：')
        // num2 = +prompt('请输入第二个数字：')
        num1 = +prompt('请输入第一个数字：')
        num2 = +prompt('请输入第二个数字：')
        operator = prompt('请输入运算符：')
        switch (operator) {
            case '+':
                document.write(`${num1} + ${num2} = ${num1 + num2}`)
                break;
            case '-':
                document.write(`${num1} - ${num2} = ${num1 - num2}`)
                break;
            case '*':
                document.write(`${num1} * ${num2} = ${num1 * num2}`)
                break;
            case '/':
                document.write(`${num1} / ${num2} = ${num1 / num2}`)
                break;
            default:
                document.write('请输入正确的运算符')
                break;
        }
    </script>
</body>

</html>
