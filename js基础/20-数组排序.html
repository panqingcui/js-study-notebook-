<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let numArr = [50, 10, 20, 30, 40]
        numArr.sort()
        console.log(numArr)
        numArr.sort((a, b) => b - a)
        console.log(numArr)
        console.log('-----------------冒泡排序')
        //冒泡排序
        for (let i = 0; i < numArr.length - 1; i++) {
            for (let j = 0; j < numArr.length - 1 - i; j++) {
                if (numArr[j] > numArr[j + 1]) {
                    let temp = numArr[j]
                    numArr[j] = numArr[j + 1]
                    numArr[j + 1] = temp
                }
            }
        }
        console.log(numArr)
    </script>
</body>

</html>
