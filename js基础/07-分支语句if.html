<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        console.log('分支语句 if ')
        name = prompt('请输入姓名：')
        password = prompt('请输入密码：')
        if (name == 'pink' && password == '123456') {
            document.write('登录成功')
        } else {
            document.write('登录失败')
        }
    </script>
</body>

</html>
