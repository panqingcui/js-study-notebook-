<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    span {
        font-size: 20px;
        display: inline-block;
        width: 100px;
        text-align: center;
        line-height: 50px;
        border: 2px solid #000;
        color: #000000;
        margin: 2px;
        padding: 5px 10px;
        border-radius: 5px;
    }
</style>

<body>
    <script>
        // 数组的定义和使用
        let arr = [1, 2, 3, 4, 5]
        console.log(arr)
        console.log(arr[0])
        console.log(arr[1])
        console.log(arr[2])
        console.log(arr[3])
        console.log(arr[4])
        console.log(arr.length)
        console.log(arr[100])
        console.log(arr[100] = 1000)
        console.log(arr)
        console.log(arr.length)
        console.log(arr[90])
        // 数组的遍历
        for (let i = 0; i < arr.length; i++) {
            console.log(arr[i])
        }

        // 省略方式
        for (let item of arr) {
            console.log(item)
        }

        arr.forEach(item => {
            console.log(item)
        })

        let numArr = [2, 6, 1, 7, 4]
        let sum = 0
        for (let item of numArr) {
            sum += item
        }
        document.write(`数组${numArr}的和为${sum}`)
        document.write('<br>')
        document.write(`数组${numArr}的平均值为${sum / numArr.length}`)

        document.write('<br>')

        numArr = [2, 6, 1, 77, 52, 25, 7]
        let max = numArr[0]
        for (let item of numArr) {
            if (item > max) {
                max = item
            }
        }
        document.write(`数组[${numArr}]的最大值为${max}`)

        document.write('<br>')

        numArr = ['a', 'b', 'c']
        document.write('数组numArr为', numArr)
        document.write('<br>')
        // 数组的添加 末尾添加
        let len = numArr.push('d', 'd')
        document.write('末尾添加"d"后 ：', numArr, ' numArr的长度为', len)
        document.write('<br>')

        len = numArr.unshift('0', '0')
        document.write('头部添加"0"后 ：', numArr, ' numArr的长度为', len)
        document.write('<br>')
        // 数组的删除 末尾删除
        len = numArr.pop()
        document.write('删除"d"后 ：', numArr, ' 删除的元素为', len)
        document.write('<br>')
        // 
        // 数组的删除 头部删除
        len = numArr.shift()
        document.write('删除"0"后 ：', numArr, ' 删除的元素为', len)
        document.write('<br>')

        numArr = [2, 0, 6, 1, 77, 0, 52, 0, 25, 7]
        document.write('数组numArr为', numArr)
        document.write('<br>')
        let newArr = []
        for (let item of numArr) {
            if (item !== 0) {
                newArr.push(item)
            }
        }
        document.write('<br>')
        document.write('不包含0 的新数组newArr为', newArr)
        document.write('<br>')

    </script>
</body>

</html>
