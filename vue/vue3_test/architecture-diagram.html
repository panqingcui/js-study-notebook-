<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>系统架构图</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family:
          -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
        background: #f5f7fa;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        padding: 40px 20px;
      }
      .container {
        background: #ffffff;
        border-radius: 12px;
        padding: 40px;
        max-width: 1200px;
        width: 100%;
      }
      h1 {
        text-align: center;
        color: #1a1a2e;
        margin-bottom: 40px;
        font-size: 28px;
        font-weight: 600;
      }
      svg {
        display: block;
        margin: 0 auto;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>系统架构图</h1>
      <svg width="1100" height="420" viewBox="0 0 1100 420" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker
            id="arrow"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="3"
            orient="auto"
            markerUnits="strokeWidth"
          >
            <path d="M0,0 L0,6 L9,3 z" fill="#6b7280" />
          </marker>
          <marker
            id="arrow-highlight"
            markerWidth="10"
            markerHeight="10"
            refX="9"
            refY="3"
            orient="auto"
            markerUnits="strokeWidth"
          >
            <path d="M0,0 L0,6 L9,3 z" fill="#3b82f6" />
          </marker>
        </defs>

        <!-- Layer Labels -->
        <text x="50" y="80" fill="#9ca3af" font-size="14" font-weight="500" letter-spacing="1">
          客户端层
        </text>
        <text x="50" y="190" fill="#9ca3af" font-size="14" font-weight="500" letter-spacing="1">
          网关层
        </text>
        <text x="50" y="300" fill="#9ca3af" font-size="14" font-weight="500" letter-spacing="1">
          服务层
        </text>
        <text x="50" y="400" fill="#9ca3af" font-size="14" font-weight="500" letter-spacing="1">
          数据层
        </text>

        <!-- Horizontal Layer Lines -->
        <line
          x1="120"
          y1="100"
          x2="1050"
          y2="100"
          stroke="#e5e7eb"
          stroke-width="1"
          stroke-dasharray="4,4"
        />
        <line
          x1="120"
          y1="210"
          x2="1050"
          y2="210"
          stroke="#e5e7eb"
          stroke-width="1"
          stroke-dasharray="4,4"
        />
        <line
          x1="120"
          y1="320"
          x2="1050"
          y2="320"
          stroke="#e5e7eb"
          stroke-width="1"
          stroke-dasharray="4,4"
        />

        <!-- Frontend Web Client -->
        <g transform="translate(350, 30)">
          <rect
            x="0"
            y="0"
            width="400"
            height="70"
            rx="8"
            fill="#dbeafe"
            stroke="#3b82f6"
            stroke-width="2"
          />
          <rect x="15" y="15" width="40" height="40" rx="6" fill="#3b82f6" />
          <text x="35" y="42" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">
            W
          </text>
          <text x="70" y="30" fill="#1e40af" font-size="16" font-weight="600">前端 Web 客户端</text>
          <text x="70" y="50" fill="#60a5fa" font-size="12">Vue3 / React / HTML5</text>
        </g>

        <!-- Arrow: Client to API Gateway -->
        <line
          x1="550"
          y1="100"
          x2="550"
          y2="135"
          stroke="#3b82f6"
          stroke-width="2"
          marker-end="url(#arrow-highlight)"
        />

        <!-- API Gateway -->
        <g transform="translate(350, 135)">
          <rect
            x="0"
            y="0"
            width="400"
            height="70"
            rx="8"
            fill="#fef3c7"
            stroke="#f59e0b"
            stroke-width="2"
          />
          <rect x="15" y="15" width="40" height="40" rx="6" fill="#f59e0b" />
          <text x="35" y="42" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">
            G
          </text>
          <text x="70" y="30" fill="#92400e" font-size="16" font-weight="600">API 网关</text>
          <text x="70" y="50" fill="#d97706" font-size="12">
            Kong / Nginx / Spring Cloud Gateway
          </text>
        </g>

        <!-- Arrows: Gateway to Microservices -->
        <line
          x1="450"
          y1="205"
          x2="320"
          y2="240"
          stroke="#6b7280"
          stroke-width="2"
          marker-end="url(#arrow)"
        />
        <line
          x1="550"
          y1="205"
          x2="550"
          y2="240"
          stroke="#6b7280"
          stroke-width="2"
          marker-end="url(#arrow)"
        />
        <line
          x1="650"
          y1="205"
          x2="780"
          y2="240"
          stroke="#6b7280"
          stroke-width="2"
          marker-end="url(#arrow)"
        />

        <!-- Microservice 1: User Service -->
        <g transform="translate(200, 240)">
          <rect
            x="0"
            y="0"
            width="240"
            height="70"
            rx="8"
            fill="#d1fae5"
            stroke="#10b981"
            stroke-width="2"
          />
          <rect x="15" y="15" width="40" height="40" rx="6" fill="#10b981" />
          <text x="35" y="42" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">
            U
          </text>
          <text x="70" y="30" fill="#065f46" font-size="15" font-weight="600">用户服务</text>
          <text x="70" y="50" fill="#34d399" font-size="12">User Service</text>
        </g>

        <!-- Microservice 2: Order Service -->
        <g transform="translate(430, 240)">
          <rect
            x="0"
            y="0"
            width="240"
            height="70"
            rx="8"
            fill="#d1fae5"
            stroke="#10b981"
            stroke-width="2"
          />
          <rect x="15" y="15" width="40" height="40" rx="6" fill="#10b981" />
          <text x="35" y="42" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">
            O
          </text>
          <text x="70" y="30" fill="#065f46" font-size="15" font-weight="600">订单服务</text>
          <text x="70" y="50" fill="#34d399" font-size="12">Order Service</text>
        </g>

        <!-- Microservice 3: Product Service -->
        <g transform="translate(660, 240)">
          <rect
            x="0"
            y="0"
            width="240"
            height="70"
            rx="8"
            fill="#d1fae5"
            stroke="#10b981"
            stroke-width="2"
          />
          <rect x="15" y="15" width="40" height="40" rx="6" fill="#10b981" />
          <text x="35" y="42" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">
            P
          </text>
          <text x="70" y="30" fill="#065f46" font-size="15" font-weight="600">商品服务</text>
          <text x="70" y="50" fill="#34d399" font-size="12">Product Service</text>
        </g>

        <!-- Arrows: Microservices to Data Layer -->
        <line
          x1="320"
          y1="310"
          x2="320"
          y2="345"
          stroke="#6b7280"
          stroke-width="2"
          marker-end="url(#arrow)"
        />
        <line
          x1="550"
          y1="310"
          x2="550"
          y2="345"
          stroke="#6b7280"
          stroke-width="2"
          marker-end="url(#arrow)"
        />
        <line
          x1="780"
          y1="310"
          x2="780"
          y2="345"
          stroke="#6b7280"
          stroke-width="2"
          marker-end="url(#arrow)"
        />

        <!-- PostgreSQL Database -->
        <g transform="translate(200, 345)">
          <rect
            x="0"
            y="0"
            width="240"
            height="70"
            rx="8"
            fill="#ede9fe"
            stroke="#8b5cf6"
            stroke-width="2"
          />
          <rect x="15" y="15" width="40" height="40" rx="6" fill="#8b5cf6" />
          <text x="35" y="42" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">
            DB
          </text>
          <text x="70" y="30" fill="#5b21b6" font-size="15" font-weight="600">
            PostgreSQL 数据库
          </text>
          <text x="70" y="50" fill="#a78bfa" font-size="12">持久化存储</text>
        </g>

        <!-- Redis Cache -->
        <g transform="translate(660, 345)">
          <rect
            x="0"
            y="0"
            width="240"
            height="70"
            rx="8"
            fill="#fee2e2"
            stroke="#ef4444"
            stroke-width="2"
          />
          <rect x="15" y="15" width="40" height="40" rx="6" fill="#ef4444" />
          <text x="35" y="42" fill="#ffffff" font-size="20" text-anchor="middle" font-weight="bold">
            R
          </text>
          <text x="70" y="30" fill="#991b1b" font-size="15" font-weight="600">Redis 缓存</text>
          <text x="70" y="50" fill="#f87171" font-size="12">高速缓存 / 会话存储</text>
        </g>

        <!-- Bidirectional arrow between PostgreSQL and Redis -->
        <path
          d="M440,380 L660,380"
          stroke="#6b7280"
          stroke-width="2"
          marker-end="url(#arrow)"
          marker-start="url(#arrow)"
        />
        <text x="550" y="375" fill="#6b7280" font-size="11" text-anchor="middle">数据同步</text>
      </svg>
    </div>
  </body>
</html>
